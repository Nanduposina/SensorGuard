[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensorguard"
version = "0.1.0"
description = "Streaming data quality checks for the Intel Berkeley sensor dataset"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "torch>=2.0", "matplotlib>=3.7"]

[project.scripts]
sensorguard-detect = "sensorguard.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]
dashboard = ["streamlit>=1.35", "plotly>=5.20"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", ".venv", "venv", "__pycache__", "build", "dist", "artifacts", "data.txt"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E402", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
